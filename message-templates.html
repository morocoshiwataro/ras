<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メッセージテンプレート</title>
<link rel="stylesheet" href="site.css">

<style>
.templateSection{margin-top:20px}

.templateGrid{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

@media(min-width:720px){
.templateGrid{grid-template-columns:1fr 1fr;}
}

.templateCard{
border:1px solid rgba(255,255,255,.14);
border-radius:16px;
padding:12px;
background:rgba(255,255,255,.04);
cursor:pointer;
}

.templateCard:hover{
border-color:rgba(199,154,75,.5);
}

.templateText{
font-size:13px;
line-height:1.6;
white-space:pre-wrap;
}

.copyBtn{
margin-top:8px;
font-size:12px;
opacity:.8;
}
</style>
</head>

<body>
<div class="wrap">

<div class="siteHeader">
<a href="home.html">【ras】鯛せんべい用：まとめサイト</a>
</div>

<div class="headingBig">📋 メッセージテンプレート</div>

<!-- 1段 -->
<div class="templateSection">
<div class="headingSmall"><span class="icon">📅</span>毎日のお知らせテンプレート</div>
<div id="dailyTemplates" class="templateGrid"></div>
</div>

<!-- 2段 -->
<div class="templateSection">
<div class="headingSmall"><span class="icon">🗓</span>週のお知らせテンプレート</div>
<div id="weeklyTemplates" class="templateGrid"></div>
</div>

<!-- 3段 -->
<div class="templateSection">
<div class="headingSmall"><span class="icon">🌍</span>国のイベントテンプレート</div>
<div id="nationTemplates" class="templateGrid"></div>
</div>

<!-- 4段 -->
<div class="templateSection">
<div class="headingSmall"><span class="icon">🛠</span>その他対応用テンプレート</div>
<div id="miscTemplates" class="templateGrid"></div>
</div>

</div>

<script>

const TEMPLATES = {

daily:{
esukoma:{
mon:"📣本日イベントなし",
tue:"📣ギルドパーティー＋守衛戦",
wed:"📣スピーカートラップ",
thu:"📣ギルドパーティー＋守衛戦",
fri:"📣金曜イベント",
sat:"📣荒野の王",
sun:"📣スピーカートラップ"
},

normal:{
mon:"📣本日イベントなし",
tue:"📣ギルドパーティー＋デッドライジング",
wed:"📣スピーカートラップ",
thu:"📣ギルドパーティー＋デッドライジング",
fri:"📣金曜イベント",
sat:"📣エンパイアウォー",
sun:"📣スピーカートラップ"
}
},

weekly:{
esukoma:"📢今週はエスコマ週です",
normal:"📢今週は通常週です"
},

nation:{
wk:"📢荒野の王が開催されます",
empire:"📢エンパイアウォーが開催されます"
},

misc:{
irregular:"📢本日はイレギュラーイベントがあります",
response:"📢対応お願いします"
}

};

function copy(text){
navigator.clipboard.writeText(text);
}

function addCard(container,text){
const div=document.createElement("div");
div.className="templateCard";
div.innerHTML=`<div class="templateText">${text}</div><div class="copyBtn">📋クリックでコピー</div>`;
div.onclick=()=>copy(text);
container.appendChild(div);
}

const daily=document.getElementById("dailyTemplates");
Object.values(TEMPLATES.daily.esukoma).forEach(t=>addCard(daily,t));
Object.values(TEMPLATES.daily.normal).forEach(t=>addCard(daily,t));

const weekly=document.getElementById("weeklyTemplates");
Object.values(TEMPLATES.weekly).forEach(t=>addCard(weekly,t));

const nation=document.getElementById("nationTemplates");
Object.values(TEMPLATES.nation).forEach(t=>addCard(nation,t));

const misc=document.getElementById("miscTemplates");
Object.values(TEMPLATES.misc).forEach(t=>addCard(misc,t));

</script>

</body>
</html>
