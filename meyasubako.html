<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>目安箱 | 【ras】鯛せんべい用：まとめサイト</title>
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <div class="wrap">
    <div class="siteHeader"><a href="home.html">【ras】鯛せんべい用：まとめサイト</a></div>

    <header>
      <h1>目安箱</h1>
      <div class="sub">ご意見・ご提案はこちらから。匿名でも投稿できます。</div>
    </header>

    <main class="card">
      <div class="headingBig">📮 投稿フォーム</div>
      <div class="embedBox">
        <iframe
          title="目安箱フォーム"
          src="https://docs.google.com/forms/d/e/1FAIpQLSeyRPiSxD4L-ttMieXGaUX5tj2bwszmONROP_dPr4wuKnlIrw/viewform?embedded=true"
          width="100%"
          height="920"
          frameborder="0"
          marginheight="0"
          marginwidth="0">読み込んでいます…</iframe>
      </div>

      <div class="sectionDivider" aria-hidden="true"></div>

      <div class="headingBig">💬 投稿一覧</div>
      <div class="sub" style="margin-top:-4px;">反映まで少し時間がかかる場合があります。</div>

      
      <!-- 🔐 官職用ロック -->
      <div id="opinionLock" class="lockBox">
        <div class="lockText">官職メンバーのみ閲覧できます</div>
        <div class="lockRow">
          <input id="lockInput" type="password" placeholder="パスワードを入力">
          <button id="lockBtn" type="button">表示</button>
        </div>
        <div id="lockError" class="lockError hidden">パスワードが違います</div>
      </div>

      <div id="opinionList" class="opinionGrid hidden" aria-live="polite">読み込み中…</div>

    </main>

    <footer>
      <b>備考：</b>個人情報の書き込みは避けてください。
    </footer>
  </div>

<script>
(function(){
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRTTG_Y7qFHHCUxMz9PlvCEdkV8gn-oqVpP-TLbe9LwhY9VKTNOXtV3BElyXjMY1Ic8nmMgZRFzbLWc/pub?output=csv";

  // CSV parser (handles quotes/newlines/commas)
  function parseCSV(text){
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++){
      const c = text[i];
      const n = text[i+1];

      if (inQuotes){
        if (c === '"' && n === '"'){
          cur += '"'; i++;
        } else if (c === '"'){
          inQuotes = false;
        } else {
          cur += c;
        }
        continue;
      }

      if (c === '"'){ inQuotes = true; continue; }
      if (c === ','){ row.push(cur); cur = ""; continue; }
      if (c === '\r'){ continue; }
      if (c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ""; continue; }
      cur += c;
    }
    row.push(cur);
    rows.push(row);
    // drop trailing empty row
    if (rows.length && rows[rows.length-1].length === 1 && rows[rows.length-1][0] === "") rows.pop();
    return rows;
  }

  function escapeHtml(str){
    return String(str ?? "").replace(/[&<>"']/g, (m)=>({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function pick(obj, keys){
    for (const k of keys){
      if (obj[k] != null && String(obj[k]).trim() !== "") return String(obj[k]).trim();
    }
    return "";
  }

  function render(items){
    const el = document.getElementById("opinionList");
    if (!el) return;

    if (!items.length){
      el.innerHTML = '<div class="opinionEmpty">まだ投稿がありません。</div>';
      return;
    }

    el.innerHTML = "";
    for (const it of items){
      const name = it.name || "匿名";
      const msg  = it.message || "";
      const time = it.time || "";

      const card = document.createElement("div");
      card.className = "opinionCard";
      card.innerHTML = `
        <div class="opinionMsg">${escapeHtml(msg)}</div>
        <div class="opinionMeta">
          <span class="opinionName">— ${escapeHtml(name)}</span>
          ${time ? `<span class="opinionTime">${escapeHtml(time)}</span>` : ``}
        </div>
      `;
      el.appendChild(card);
    }
  }

  fetch(CSV_URL, { cache: "no-store" })
    .then(r => {
      if (!r.ok) throw new Error("fetch failed");
      return r.text();
    })
    .then(text => {
      const rows = parseCSV(text);
      if (!rows.length) return render([]);

      const header = rows[0].map(h => (h || "").trim());
      const dataRows = rows.slice(1).filter(r => r.some(x => String(x || "").trim() !== ""));

      const items = dataRows.map(r => {
        const obj = {};
        header.forEach((h, idx) => { obj[h] = r[idx] ?? ""; });

        return {
          // よくある列名に対応（フォーム側の表記が多少違っても拾う）
          time: pick(obj, ["タイムスタンプ", "Timestamp", "timestamp", "送信日時"]),
          name: pick(obj, ["名前", "お名前", "name", "Name"]),
          message: pick(obj, ["ご意見", "投稿された内容", "内容", "message", "Message"])
        };
      }).filter(x => (x.message || "").trim() !== "");

      // 新しいものが上（タイムスタンプが無い場合でも入力順の逆）
      render(items.reverse());
    })
    .catch(() => {
      const el = document.getElementById("opinionList");
      if (el) el.innerHTML = '<div class="opinionEmpty">投稿一覧を表示できませんでした。</div>';
    });
})();

// 🔐 投稿一覧ロック
(function(){
  const PASS = "yoshioka";
  const list = document.getElementById("opinionList");
  const box  = document.getElementById("opinionLock");
  const input = document.getElementById("lockInput");
  const btn   = document.getElementById("lockBtn");
  const err   = document.getElementById("lockError");

  function unlock(){
    list.classList.remove("hidden");
    box.classList.add("hidden");
    localStorage.setItem("meyasubakoUnlocked","1");
  }

  if(localStorage.getItem("meyasubakoUnlocked")==="1"){
    unlock();
  }

  btn.addEventListener("click", ()=>{
    if(input.value === PASS){
      unlock();
    }else{
      err.classList.remove("hidden");
    }
  });
})();
</script>

</body>
</html>
