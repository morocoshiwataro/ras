<script>
  (function () {
    // ===== 設定（ローテーションの基準）=====
    // 「エスコマ週」と「通常週」は完全に交互。現在（この週）はエスコマ週、という前提で基準日を置いています。
    // 必要なら、この日付だけ変更してください（基準の週の“月曜日”推奨）。
    const ANCHOR_MONDAY = new Date(Date.UTC(2026, 0, 20)); // 2026-01-20 をエスコマ週の基準にする（※月曜始まりで扱う）

    // 金曜の★ローテ（3週サイクル）。今週は「氷原の戦い」からスタート。
    const FRIDAY_ROTATION = [
      "氷原の戦い（21:00～）",
      "ギルド大乱闘（21:00～）",
      "浄水争奪戦（21:00～）"
    ];

    // ===== 今日の「🎁受け取り・使用推奨アイテム」 =====
    // 書き方：全角スペース「　」で区切ると箇条書き表示になります。
    const ITEMS_ESUKOMA = {
      1: "英雄（バー・万能の欠片・英雄チョイス・ハッピー大賞）　コロシアムサプライズ補給　ナノウェポン（材料獲得・作成）",
      2: "",
      3: "",
      4: "訓練ブースト",
      5: "ミュータントPt　メカ　器官強化ルーン",
      6: "装備　チップ　モジュール　キューブ　物資補給（巣窟でもらえる箱）　守衛戦の報酬　ナノウェポン（作成以外）",
      0: ""
    };
    const ITEMS_NORMAL = {
      1: "英雄（バー・万能の欠片・英雄チョイス・ハッピー大賞）　コロシアムサプライズ補給",
      2: "ブースト",
      3: "装備　収蔵品　結晶核",
      4: "ミュータントPt　モジュール",
      5: "グローリー　器官強化ルーン　メカ",
      6: "ダイヤ",
      0: "ダイヤ　チップ　キューブ　エンパの報酬"
    };

    function startOfWeekMondayUTC(d){
  const x = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  const day = (x.getUTCDay() + 6) % 7; // Mon=0 ... Sun=6
  x.setUTCDate(x.getUTCDate() - day);
  x.setUTCHours(0,0,0,0);
  return x;
}
    function weeksBetween(anchor, d){
      const ms = 7 * 24 * 60 * 60 * 1000;
      const diff = startOfWeekMondayUTC(d) - startOfWeekMondayUTC(anchor);
      return Math.round(diff / ms);
    }

    const now = new Date();
      const today = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate()));
      const weekday = today.getUTCDay(); // Sun=0 ... Sat=6

    const weekIndex = weeksBetween(ANCHOR_MONDAY, today);
    const isEsukomaWeek = (weekIndex % 2 === 0); // 0週目＝エスコマ週
    const weekLabel = isEsukomaWeek ? "エスコマ週" : "通常週";

    function eventsForToday(){
      if (weekday === 1){ // 月
        return [];
      }
      if (weekday === 2){ // 火 ※隔週
        return isEsukomaWeek
          ? ["ギルドパーティー（21:00～）", "ギルド守衛戦（21:30～）"]
          : ["ギルドパーティー（21:00～）", "デッドライジング（21:30～）"];
      }
      if (weekday === 3){ // 水
        return ["スピーカートラップ（21:00～）"];
      }
      if (weekday === 4){ // 木 ※隔週
        return isEsukomaWeek
          ? ["ギルドパーティー（21:00～）", "ギルド守衛戦（21:30～）"]
          : ["ギルドパーティー（21:00～）", "デッドライジング（21:30～）"];
      }
      if (weekday === 5){ // 金 ★3週ローテ
        const rot = ((weekIndex % 3) + 3) % 3;
        return [FRIDAY_ROTATION[rot]];
      }
      if (weekday === 6){ // 土 ※隔週
        return isEsukomaWeek ? ["荒野の王（19:00～）"] : ["エンパイアウォー（19:00～）"];
      }
      if (weekday === 0){ // 日
        return ["スピーカートラップ（21:00～）"];
      }
      return [];
    }

    function renderBullets(targetEl, text){
      if (!targetEl) return;
      const s = (text || "").trim();
      if (!s){
        targetEl.textContent = "（なし）";
        return;
      }
      const parts = s.split("　").map(x => x.trim()).filter(Boolean);
      if (parts.length <= 1){
        targetEl.textContent = s;
        return;
      }
      targetEl.innerHTML = parts.map(p => "・" + p).join("<br/>");
    }


function renderPills(targetEl, text, pillClass){
  if (!targetEl) return;
  const s = (text || "").trim();
  if (!s){
    targetEl.innerHTML = '<span class="' + pillClass + ' isEmpty">（なし）</span>';
    return;
  }
  const parts = s.split("　").map(x => x.trim()).filter(Boolean);
  targetEl.innerHTML = parts.map(p => '<span class="' + pillClass + '">' + p + '</span>').join("");
}

    const ev = eventsForToday();
    const bodyEl = document.getElementById("todayBannerBody");
    const tagWeekEl = document.getElementById("todayTagWeek");
    const tagDayEl = document.getElementById("todayTagDay");
    const itemsEl = document.getElementById("todayItemsBody");

    if (tagWeekEl) tagWeekEl.textContent = weekLabel;
    if (tagDayEl) tagDayEl.textContent = ["日","月","火","水","木","金","土"][weekday] + "曜日";

    if (bodyEl){
      if (!ev.length){
        bodyEl.textContent = "本日のギルドイベントはありません。";
      } else if (ev.length === 1){
        bodyEl.textContent = ev[0];
      } else {
        bodyEl.innerHTML = ev.map(s => "・" + s).join("<br/>");
      }
    }

    const items = (isEsukomaWeek ? ITEMS_ESUKOMA : ITEMS_NORMAL)[weekday] || "";
    renderPills(itemsEl, items, "todayItemPill");
})();
</script>
