<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>宝箱の希望 | 【ras】鯛せんべい用：まとめサイト</title>
  <link rel="stylesheet" href="site.css">
</head>
<body class="pageTakarabako">
  <div class="wrap">
    <div class="siteHeader"><a href="home.html">【ras】鯛せんべい用：まとめサイト</a></div>

    <header>
      <h1>宝箱の希望</h1>
</header>

    <main class="card">

      <div class="headingBig">📦 希望フォーム</div>
      <div class="embedBox">
        <iframe
          title="宝箱の希望フォーム"
          src="https://docs.google.com/forms/d/e/1FAIpQLSc5nlOMWkG61ha2Or5G_fqOi5q4jm-cfmzTgWYgjkzqAbg7Jw/viewform?embedded=true"
          height="920"
          marginheight="0"
          marginwidth="0">読み込んでいます…</iframe>
      </div>

      <div class="sectionDivider" aria-hidden="true"></div>

      <div class="headingBig">📋 最新の提出内容</div>

      <div class="filterBar" aria-label="絞り込み">
        <div class="field">
          <label for="nameFilter">名前（例：ウポツ / しげじゅん）</label>
          <input id="nameFilter" type="text" placeholder="例：ウポツ / しげじゅん" />
        </div>
        <div class="field">
          <label for="firstFilter">第一希望</label>
          <select id="firstFilter">
            <option value="">すべて</option>
          </select>
        </div>
        <div class="field">
          <label>&nbsp;</label>
          <button id="clearBtn" class="clearBtn" type="button">条件をクリア（全員表示）</button>
        </div>
      </div>

      <div id="wishList" class="opinionGrid" aria-live="polite">読み込み中…</div>
    </main>

    <footer>
      <b>備考：</b>希望内容の表記はフォーム回答を元に表示しています。
    </footer>
  </div>

<script>
(function(){
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSgUYR3CVxvTefgCXYgkqJvXzRtACMLCA2tJm-xFXr6wPL5hJSVs-EO2d_jQvGB2ZMnC3k1KPlLq7TB/pub?output=csv";

  function parseCSV(text){
    const rows = [];
    let row = [];
    let cur = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const n = text[i+1];

      if (c === '"') {
        if (inQuotes && n === '"') {
          cur += '"';
          i++;
        } else {
          inQuotes = !inQuotes;
        }
        continue;
      }

      if (!inQuotes && c === ',') {
        row.push(cur);
        cur = "";
        continue;
      }

      if (!inQuotes && (c === '\n' || c === '\r')) {
        if (c === '\r' && n === '\n') i++;
        row.push(cur);
        rows.push(row);
        row = [];
        cur = "";
        continue;
      }

      cur += c;
    }
    row.push(cur);
    rows.push(row);
    return rows.filter(r => r.length > 1 && r.some(x => (x||"").trim() !== ""));
  }

  function normalize(s){ return (s||"").trim(); }

  function stripParen(s){
    return normalize(s).replace(/\s*\（.*?\）\s*/g, "").replace(/\s*\(.*?\)\s*/g, "");
  }

  function parseDate(ts){
    const d = new Date(ts);
    if (!isNaN(d)) return d;
    const d2 = new Date((ts||"").replace(/\//g,'-'));
    return isNaN(d2) ? null : d2;
  }

  function toDateOnly(d){
    if (!d) return "";
    try { return d.toLocaleDateString('ja-JP'); } catch(e) { return ""; }
  }

  function pickHeaderIndex(headers, candidates){
    const lower = headers.map(h => (h||"").toLowerCase());
    for (const c of candidates){
      const i = lower.indexOf(c.toLowerCase());
      if (i >= 0) return i;
    }
    for (let i=0;i<lower.length;i++) {
      for (const c of candidates) {
        if (lower[i].includes(c.toLowerCase())) return i;
      }
    }
    return -1;
  }

  function escapeHtml(str){
    return (str||"").replace(/[&<>"']/g,m=>({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
    }[m]));
  }

  function render(rows){
    const list = document.getElementById("wishList");
    const nameInput = document.getElementById("nameFilter");
    const firstSel = document.getElementById("firstFilter");
    const clearBtn = document.getElementById("clearBtn");

    function applyFilter(){
      const nameQ = normalize(nameInput.value).toLowerCase();
      const firstQ = firstSel.value;

      const filtered = rows.filter(r => {
        const nameOk = !nameQ || (r.name||"").toLowerCase().includes(nameQ);
        const firstOk = !firstQ || r.c1 === firstQ; // 第一希望のみ
        return nameOk && firstOk;
      });

      if (!filtered.length){
        list.textContent = "条件に一致する結果がありません。";
        return;
      }

      list.innerHTML = "";
      filtered.forEach(r => {
        const card = document.createElement("div");
        card.className = "opinionCard";
        card.innerHTML = `<div class="opinionMain"><div><b>第一希望：</b> ${escapeHtml(r.c1 || "—")}</div><div><b>第二希望：</b> ${escapeHtml(r.c2 || "—")}</div><div><b>第三希望：</b> ${escapeHtml(r.c3 || "—")}</div></div><div class="opinionMeta"><span class="opinionName">${escapeHtml(r.name || "—")}</span><span>${escapeHtml(r.dateOnly || "")}</span></div>`;
        list.appendChild(card);(card);
      });
    }

    nameInput.addEventListener("input", applyFilter);
    firstSel.addEventListener("change", applyFilter);
    clearBtn.addEventListener("click", () => {
      nameInput.value = "";
      firstSel.value = "";
      applyFilter();
    });

    const opts = Array.from(new Set(rows.map(r => r.c1).filter(Boolean)));
    opts.sort((a,b) => a.localeCompare(b,'ja'));
    opts.forEach(v => {
      const o = document.createElement("option");
      o.value = v;
      o.textContent = v;
      firstSel.appendChild(o);
    });

    applyFilter();
  }

  fetch(CSV_URL)
    .then(r => r.text())
    .then(csv => {
      const grid = parseCSV(csv);
      const headers = grid[0].map(h => normalize(h));
      const body = grid.slice(1);

      const idxTS = pickHeaderIndex(headers, ["タイムスタンプ","timestamp"]);
      const idxName = pickHeaderIndex(headers, ["名前","name"]);
      const idxC1 = pickHeaderIndex(headers, ["第1希望","第１希望","第一希望","first"]);
      const idxC2 = pickHeaderIndex(headers, ["第2希望","第２希望","第二希望","second"]);
      const idxC3 = pickHeaderIndex(headers, ["第3希望","第３希望","第三希望","third"]);

      const mapped = body.map(cols => {
        const ts = idxTS >= 0 ? (cols[idxTS]||"") : "";
        const d = parseDate(ts);
        return {
          tsDate: d || new Date(0),
          dateOnly: toDateOnly(d),
          name: normalize(idxName>=0 ? cols[idxName] : ""),
          c1: stripParen(idxC1>=0 ? cols[idxC1] : ""),
          c2: stripParen(idxC2>=0 ? cols[idxC2] : ""),
          c3: stripParen(idxC3>=0 ? cols[idxC3] : "")
        };
      }).filter(r => r.name);

      const byName = new Map();
      mapped.forEach(r => {
        const key = r.name.toLowerCase();
        const prev = byName.get(key);
        if (!prev || r.tsDate > prev.tsDate) byName.set(key, r);
      });

      const rows = Array.from(byName.values()).sort((a,b) => b.tsDate - a.tsDate);
      render(rows);
    })
    .catch(() => {
      document.getElementById("wishList").textContent = "表示できませんでした。";
    });
})();
</script>

</body>
</html>
